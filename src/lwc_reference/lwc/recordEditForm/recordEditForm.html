<!-- Record Edit Form -->
<template>
    <lightning-card title='Record Edit Form'>
        <lightning-record-edit-form object-api-name={objectName}>
            <lightning-messages ></lightning-messages>
            <lightning-input-field field-name={fields.title}></lightning-input-field>
            <lightning-input-field field-name={fields.name}></lightning-input-field>
            <lightning-input-field field-name={fields.email}></lightning-input-field>
            <lightning-input-field field-name={fields.phone}></lightning-input-field>
            <lightning-input-field field-name={fields.account}></lightning-input-field>
            <lightning-button class='slds-var-m-around_x-small'
                              onclick={handleCancel}
                              label='cancel'>
            </lightning-button>
            <lightning-button class='slds-var-m-around_x-small'
                              variant="brand"
                              type="submit"
                              label='save'>
            </lightning-button>
        </lightning-record-edit-form>

    </lightning-card>
</template>
