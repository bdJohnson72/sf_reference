<!-- Nav To Object Page -->
<template>
    <lightning-card title='Nav to New SObject'>
        <lightning-button variant="brand"
                          label='nav to new SObject'
                          onclick={handleNavigate}>
        </lightning-button>
    </lightning-card>
    <lightning-card title="Navigate to record with default values">
        <lightning-button variant="brand"
                          onclick={navigateToRecordWithValues}
                          label="Navigate to record with defaults">
        </lightning-button>
    </lightning-card>
    <lightning-card title="Nav to List View">
        <lightning-button variant="brand"
                          onclick={navToListView}
                          label="Nav to List View">
        </lightning-button>
    </lightning-card>
    <lightning-card title="Nav to Files">
        <lightning-button variant="brand"
                          onclick={navToFiles}
                          label="Nav to Files">
        </lightning-button>
    </lightning-card>
</template>
