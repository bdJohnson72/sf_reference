<!-- Filtering Sorting Demo -->
<template>
    <lightning-card title="Client Side Filtering">
        <div class="slds-var-p-around_medium">
            <lightning-layout >
                <lightning-layout-item size="4" padding="around-small">
                    <lightning-input type="text"
                                     label="filter"
                                     onkeypress={filterHandler}>
                    </lightning-input>
                </lightning-layout-item>
            </lightning-layout>
            <table>
                <thead>
                     <tr>
                         <template for:each={headings} for:item="heading">
                             <th key={heading}>{heading}</th>
                         </template>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={filteredData} for:item="data">
                        <tr key={data.Id}>
                            <td>{data.Id}</td>
                            <td>{data.Name}</td>
                            <td>{data.Title}</td>
                            <td>{data.Email}</td>
                        </tr>

                    </template>
                </tbody>
            </table>
        </div>
    </lightning-card>
</template>
