<!-- Contact Data Table -->
<template>
    <template if:true={contacts}>
        <lightning-datatable
                hide-checkbox-column
                show-row-number-column
                onrowaction={handleRowAction}
                key-field={id}
                data={contacts}
                onsort={handleSort}
                sorted-by={sortedBy}
                sorted-direction={sortedDirection}
                default-sort-direction={defaultSortingDirection}
                columns={columns}>
        </lightning-datatable>
    </template>
</template>
